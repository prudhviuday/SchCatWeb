name: Audit source reference workbooks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-source-workbooks.yml"
      - "tools/audit-source-workbooks.mjs"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: prudhviuday/SchCat
          ref: main
          path: source-schcat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary workbook reader
        run: npm install --no-save xlsx
      - name: Audit workbook schemas without importing personal workbooks
        run: node tools/audit-source-workbooks.mjs source-schcat /tmp/source-workbook-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-workbook-audit
          path: /tmp/source-workbook-audit.json
          retention-days: 2

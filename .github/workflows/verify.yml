name: SchCatWeb verification

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "worker/**"
      - "wrangler.toml"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/verify.yml"
      - ".github/workflows/convert-source-reference-data.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/verify.yml"

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run calculation parity tests
        working-directory: frontend
        run: npm run test:analysis
      - name: Run provider request-shape tests
        working-directory: frontend
        run: npm run test:providers
      - name: Run live ChartInk scan client tests
        working-directory: frontend
        run: npm run test:chartink
      - name: Run ChartInk historical backtest tests
        working-directory: frontend
        run: npm run test:chartink-history
      - name: Run live MarketSmith data mapping tests
        working-directory: frontend
        run: npm run test:marketsmith
      - name: Run chart data parity tests
        working-directory: frontend
        run: npm run test:charts
      - name: Run technical indicator parity tests
        working-directory: frontend
        run: npm run test:indicators
      - name: Run static reference data tests
        working-directory: frontend
        run: npm run test:reference
      - name: Run NikScore updater parity tests
        working-directory: frontend
        run: npm run test:nikscore
      - name: Run stock screener tests
        working-directory: frontend
        run: npm run test:screener
      - name: Run watchlist and saved query tests
        working-directory: frontend
        run: npm run test:watchlists
      - name: Run chart workspace tests
        working-directory: frontend
        run: npm run test:workspace
      - name: Run Multi-Stock Analysis tests
        working-directory: frontend
        run: npm run test:multi-stock-analysis
      - name: Run Right Panel chart tests
        working-directory: frontend
        run: npm run test:right-panel
      - name: Run industry analysis tests
        working-directory: frontend
        run: npm run test:industry
      - name: Run live industry analysis tests
        working-directory: frontend
        run: npm run test:industry-live
      - name: Run Research tests
        working-directory: frontend
        run: npm run test:research
      - name: Run Market Pulse tests
        working-directory: frontend
        run: npm run test:market-pulse
      - name: Run Portfolio tests
        working-directory: frontend
        run: npm run test:portfolio
      - name: Build static website
        working-directory: frontend
        run: npm run build
      - name: Run production integration smoke tests
        working-directory: frontend
        run: npm run test:integration
      - name: Validate Cloudflare Worker bundle and static asset configuration
        run: npx --yes wrangler deploy --dry-run --config ./wrangler.toml
      - name: Verify static build output and deployment config
        run: test -s frontend/dist/index.html && test -s wrangler.toml && test -s frontend/dist/data/marketSmithIds.json && test -s frontend/dist/data/marketUniverse.json && test -s frontend/dist/data/industries.json && test -s frontend/dist/data/manifest.json

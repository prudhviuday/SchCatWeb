name: SchCatWeb verification

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "wrangler.toml"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/verify.yml"
      - ".github/workflows/convert-source-reference-data.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "wrangler.toml"
      - ".github/workflows/verify.yml"

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run calculation parity tests
        working-directory: frontend
        run: npm run test:analysis
      - name: Run provider request-shape tests
        working-directory: frontend
        run: npm run test:providers
      - name: Run chart data parity tests
        working-directory: frontend
        run: npm run test:charts
      - name: Run technical indicator parity tests
        working-directory: frontend
        run: npm run test:indicators
      - name: Run static reference data tests
        working-directory: frontend
        run: npm run test:reference
      - name: Run stock screener tests
        working-directory: frontend
        run: npm run test:screener
      - name: Build static website
        working-directory: frontend
        run: npm run build
      - name: Verify static build output and deployment config
        run: test -s frontend/dist/index.html && test -s wrangler.toml && test -s frontend/dist/data/marketSmithIds.json && test -s frontend/dist/data/marketUniverse.json && test -s frontend/dist/data/industries.json && test -s frontend/dist/data/manifest.json
